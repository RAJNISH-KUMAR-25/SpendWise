services:
  mysql:
    image: mysql:8.4
    container_name: spendwise-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: spendwise
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-spendwise_root_password}
    ports:
      - "3306:3306"
    volumes:
      - spendwise_mysql_data:/var/lib/mysql
      - ./database/spendwise.sql:/docker-entrypoint-initdb.d/spendwise.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: spendwise-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/spendwise?serverTimezone=Asia/Kolkata
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-spendwise_root_password}
      DDL_AUTO: update
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080/api
    container_name: spendwise-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  spendwise_mysql_data:

